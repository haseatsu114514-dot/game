<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Rila Riders Rescue - Stage 1</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="game-shell">
    <header class="title-bar">
      <h1>Rila Riders Rescue</h1>
      <p>彼氏に甘い話を持ちかける悪の組織へ殴り込み。バイク接触で15秒無敵。</p>
    </header>

    <section class="screen-wrap">
      <canvas id="game" width="320" height="180" aria-label="game screen"></canvas>
      <div id="hud-layer">
        <div id="hud-ammo"></div>
        <div id="hud-charge-container">
          <div id="hud-charge-fill"></div>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="touch controls">
      <div class="cluster cluster-left">
        <button id="btn-left" class="ctrl">◀</button>
        <button id="btn-right" class="ctrl">▶</button>
      </div>
      <div class="cluster cluster-right">
        <button id="btn-jump" class="ctrl action">JUMP</button>
        <button id="btn-attack" class="ctrl action attack">攻撃</button>
        <button id="btn-style" class="ctrl action special">STYLE</button>
        <button id="btn-special" class="ctrl action special">BURST</button>
        <button id="btn-special2" class="ctrl action special" style="display:none;">burst2</button>
      </div>
    </section>

    <section class="volume-control" aria-label="volume">
      <label for="vol-slider">🔊 Volume</label>
      <input id="vol-slider" type="range" min="0" max="100" value="70" />
      <span id="vol-value">70%</span>
    </section>

    <footer class="help">
      <p>PC: ← → 移動 / Space ジャンプ / J,F = 攻撃(射撃) / S = スタイル切替 / K = burst1 / L = burst2 / Enter スキップ / M = ミュート</p>
    </footer>
  </main>

  <script src="game.v0.6.1.js"></script>
</body>

</html>
